<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClipForge AI — set your product in type</title>
    <meta
      name="description"
      content="Type one paragraph about your product and watch a video script, subtitles and social copy get set from it. Runs entirely in your browser."
    />
    <meta name="color-scheme" content="light" />
    <!-- Noto Serif TC / Noto Sans TC 也是影片合成元件寫死的字族名，
         載進來同時解決頁面與 Player 內的字型；Google Fonts 的 unicode-range
         分片讓英文訪客只會下載 latin 子集。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F7F5F0'/><circle cx='16' cy='16' r='7' fill='%23C8321E'/></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
